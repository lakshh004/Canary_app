trigger:
  branches:
    include:
      - main

variables:
  acrName: lakshyaacr
  imageName: flask-app

stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: acr-connection
        repository: $(imageName)
        command: buildAndPush
        dockerfile: Dockerfile
        tags: canary

- stage: DeployCanary
  dependsOn: Build
  jobs:
  - job: DeployCanary
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: KubernetesManifest@1
      inputs:
        action: deploy
        connectionType: kubernetesServiceConnection
        kubernetesServiceConnection: aks-connection
        manifests: k8s/canary-deployment.yaml

- stage: HealthCheck
  dependsOn: DeployCanary
  jobs:
  - job: WaitAndCheck
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: KubernetesManifest@1
      inputs:
        action: deploy
        connectionType: kubernetesServiceConnection
        kubernetesServiceConnection: aks-connection
        manifests: k8s/service.yaml

    # ✅ FIX: login to cluster before kubectl
    - task: Kubernetes@1
      inputs:
        connectionType: Kubernetes Service Connection
        kubernetesServiceEndpoint: aks-connection
        command: login

    - script: |
        echo "Waiting 2 minutes for canary to stabilize..."
        sleep 120
        kubectl rollout status deployment/app-canary --timeout=60s
      displayName: Check canary health

- stage: Promote
  dependsOn: HealthCheck
  jobs:
  - job: PromoteToStable
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: acr-connection
        repository: $(imageName)
        command: buildAndPush
        dockerfile: Dockerfile
        tags: stable

    - task: KubernetesManifest@1
      inputs:
        action: deploy
        connectionType: kubernetesServiceConnection
        kubernetesServiceConnection: aks-connection
        manifests: k8s/stable-deployment.yaml